<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON CROWN — TEST</title>
<style>
  body {
    margin: 0;
    background: #0a0d10;
    color: #d4af37;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  #screen1, #screen2 {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  #screen2 { display: none; }
  h1 {
    font-size: 32px;
    letter-spacing: 8px;
    color: #d4af37;
    text-shadow: 0 0 20px #b8860b;
    margin: 0;
  }
  h2 {
    font-size: 12px;
    letter-spacing: 5px;
    color: #8a7e6e;
    margin: 0;
    font-weight: normal;
  }
  button {
    background: #2e2a24;
    border: 2px solid #b8860b;
    color: #f0e0c0;
    font-family: inherit;
    font-weight: bold;
    font-size: 18px;
    padding: 16px 48px;
    letter-spacing: 4px;
    border-radius: 4px;
    box-shadow: 0 0 20px #b8860b66;
    cursor: pointer;
  }
  button:active {
    background: #4a3e2e;
    transform: scale(0.96);
  }
  .msg {
    font-size: 14px;
    color: #7ac0e8;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div id="screen1">
  <h1>IRON CROWN</h1>
  <h2>TEST BUILD</h2>
  <button id="go">▶ TAP ME</button>
  <div class="msg" id="msg1"></div>
</div>

<div id="screen2">
  <h1>IT WORKS</h1>
  <h2>Screen switching is functional</h2>
  <div class="msg">If you can see this, taps work.</div>
  <button id="back">↻ BACK</button>
</div>

<script>
  document.getElementById('go').addEventListener('click', function() {
    document.getElementById('msg1').textContent = 'tap detected...';
    setTimeout(function() {
      document.getElementById('screen1').style.display = 'none';
      document.getElementById('screen2').style.display = 'flex';
    }, 200);
  });

  document.getElementById('back').addEventListener('click', function() {
    document.getElementById('screen2').style.display = 'none';
    document.getElementById('screen1').style.display = 'flex';
    document.getElementById('msg1').textContent = '';
  });
</script>

</body>
  </html>
