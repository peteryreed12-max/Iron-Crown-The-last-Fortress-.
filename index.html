<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d10">
<title>IRON CROWN</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: #05070a;
    font-family: 'Courier New', monospace;
    color: #c9b896;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    position: relative; width: 100vw; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(ellipse at 50% 100%, #1a1208 0%, #05070a 70%), #05070a;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ============ TITLE ============ */
  #title-screen { align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .crown {
    width: 90px; height: 62px; margin-bottom: 20px;
    background: linear-gradient(#d4af37, #6b4a08);
    clip-path: polygon(0% 100%, 0% 35%, 15% 50%, 30% 15%, 50% 42%, 70% 15%, 85% 50%, 100% 35%, 100% 100%);
    filter: drop-shadow(0 0 14px #b8860baa);
  }
  #title-screen h1 {
    font-size: clamp(28px, 9vw, 52px); letter-spacing: 10px;
    color: #d4af37; font-weight: 700;
    text-shadow: 0 0 24px #b8860b, 0 2px 4px #000; line-height: 1;
  }
  #title-screen h2 {
    font-size: clamp(9px, 3vw, 14px); letter-spacing: 7px;
    color: #8a7e6e; margin: 8px 0 40px; font-weight: 400;
  }
  .btn {
    background: linear-gradient(#2e2a24, #1a1612);
    border: 1.5px solid #b8860b;
    color: #f0e0c0;
    font-family: inherit; font-weight: bold;
    font-size: clamp(14px, 3.8vw, 18px);
    padding: 15px 44px; border-radius: 4px;
    letter-spacing: 4px;
    box-shadow: 0 0 20px #b8860b44, inset 0 0 12px #00000088;
    cursor: pointer; transition: 0.1s;
    text-transform: uppercase;
  }
  .btn:active { transform: scale(0.96); background: #4a3e2e; }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .tagline { font-size: 10px; letter-spacing: 4px; color: #5a5248; margin-top: 30px; }

  /* ============ GAME ============ */
  #game-screen { background: #0a0d10; }

  .topbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    background: linear-gradient(#14100a, #0a0805);
    border-bottom: 1px solid #3a2a10;
    font-size: 9px;
    flex-shrink: 0;
  }
  .quit-btn {
    flex-shrink: 0;
    background: #1a1612;
    border: 1px solid #6b4a08;
    color: #d4af37;
    font-family: inherit;
    font-size: 10px;
    padding: 6px 8px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 3px;
  }
  .quit-btn:active { background: #2e2a24; }
  .hp-block { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hp-block.right { align-items: flex-end; }
  .hp-label {
    font-size: 9px; letter-spacing: 2px; font-weight: bold;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .hp-block.left .hp-label { color: #7ac0e8; }
  .hp-block.right .hp-label { color: #e87a7a; }
  .hp-track {
    width: 100%; height: 8px;
    background: #0a0805; border: 1px solid #3a2a10;
    border-radius: 2px; overflow: hidden;
  }
  .hp-fill { height: 100%; transition: width 0.4s ease; }
  .hp-block.left .hp-fill { background: linear-gradient(90deg, #4a8ab0, #7ac0e8); box-shadow: 0 0 8px #7ac0e888; }
  .hp-block.right .hp-fill { background: linear-gradient(270deg, #b04a4a, #e87a7a); box-shadow: 0 0 8px #e87a7a88; }
  .hp-num { font-size: 8px; color: #8a7e6e; letter-spacing: 1px; white-space: nowrap; }

  .pause-btn {
    flex-shrink: 0; width: 38px; height: 38px;
    border-radius: 50%;
    background: radial-gradient(circle, #2e2a24, #0a0805);
    border: 2px solid #b8860b;
    color: #d4af37; font-size: 14px;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 12px #b8860b66;
    transition: 0.1s;
  }
  .pause-btn:active { transform: scale(0.93); }
  .pause-btn.paused { background: radial-gradient(circle, #4a2e08, #1a0805); border-color: #e8a87a; color: #e8a87a; }

  .battlefield {
    flex: 1; position: relative; display: flex; overflow: hidden;
    background: linear-gradient(180deg, #0a0d10 0%, #12100c 35%, #1a1208 60%, #0a0705 100%);
    min-height: 0;
  }
  .battlefield::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 18%;
    background: repeating-linear-gradient(90deg, #100c07 0 10px, #16110a 10px 20px);
    border-top: 1px solid #2a2018;
    box-shadow: inset 0 6px 14px #000;
    pointer-events: none;
  }
  .sky-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 55%, #b06020 0%, transparent 55%);
    opacity: 0.18; pointer-events: none;
  }
  .fortress {
    position: relative; z-index: 2;
    width: 32%; min-width: 105px;
    display: flex; flex-direction: column;
    padding: 4px 5px 16%; gap: 3px;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  .fortress::-webkit-scrollbar { display: none; }
  .fortress.player { background: linear-gradient(90deg, #0d1418ee 0%, #0d141888 60%, transparent 100%); }
  .fortress.enemy  { background: linear-gradient(270deg, #180d0dee 0%, #180d0d88 60%, transparent 100%); }
  .fortress-label {
    position: sticky; top: 0;
    font-size: 7px; letter-spacing: 1.5px;
    padding: 3px 2px; text-align: center;
    text-transform: uppercase; z-index: 3;
    background: #0a0805cc; border-radius: 2px; margin-bottom: 2px;
    flex-shrink: 0;
  }
  .fortress.player .fortress-label { color: #7ac0e8; border: 1px solid #3a5a6a; }
  .fortress.enemy  .fortress-label { color: #e87a7a; border: 1px solid #6a3a3a; }

  .no-mans-land { position: absolute; inset: 0 32% 0 32%; z-index: 1; pointer-events: none; }

  .room {
    position: relative;
    background: linear-gradient(180deg, #1c1a16 0%, #0f0d0a 100%);
    border-left: 3px solid #6b4a08;
    border-top: 1px solid #2a2418;
    border-right: 1px solid #2a2418;
    border-bottom: 1px solid #0a0805;
    padding: 5px 5px 5px 7px;
    font-size: 8px; line-height: 1.15;
    cursor: pointer; transition: 0.12s;
    min-height: 42px;
    display: flex; flex-direction: column; gap: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .room:active { background: #2a2418; }
  .room .rname {
    font-weight: bold; letter-spacing: 0.8px; color: #c9b896;
    display: flex; justify-content: space-between; align-items: center; gap: 3px; font-size: 8px;
  }
  .room .rname .ricon { color: #b8860b; font-size: 10px; }
  .room .rname .rhp { color: #8a7e6e; font-size: 7px; font-weight: normal; }
  .room .hpbar { height: 3px; background: #0a0805; border-radius: 2px; overflow: hidden; border: 1px solid #2a2018; }
  .room .hpfill { height: 100%; background: linear-gradient(90deg, #4a8ab0, #7ac0e8); }
  .room.aether { border-left-color: #6a2a8a; background: linear-gradient(180deg, #1a0f22 0%, #0a060f 100%); }
  .room.aether .rname { color: #b88ad8; }

  .control-panel {
    background: linear-gradient(#0e1114, #08090b);
    border-top: 1px solid #3a2a10;
    padding: 5px 7px;
    display: flex; flex-direction: column; gap: 5px;
    flex-shrink: 0;
  }
  .resource-row { display: flex; gap: 4px; font-size: 9px; letter-spacing: 0.8px; }
  .res {
    flex: 1; min-width: 0;
    background: #0a0805; border: 1px solid #2a2018;
    padding: 4px 6px; border-radius: 3px;
    color: #8a7e6e;
    display: flex; justify-content: space-between; align-items: center;
    white-space: nowrap; overflow: hidden; font-size: 9px;
  }
  .res .val { color: #d4af37; font-weight: bold; font-size: 10px; }

  .crew-row {
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
    min-height: 30px;
    align-items: center;
  }
  .crew-row::-webkit-scrollbar { display: none; }
  .crew-placeholder { font-size: 8px; color: #4a4030; letter-spacing: 2px; padding: 4px; }

  .action-row { display: flex; gap: 5px; }
  .action-row .btn {
    flex: 1;
    padding: 9px 4px;
    font-size: 9.5px;
    letter-spacing: 1.5px;
    border-radius: 3px;
    box-shadow: 0 0 8px #b8860b33, inset 0 0 8px #00000088;
  }

  .log {
    background: #05070a;
    border-top: 1px solid #2a2018;
    padding: 3px 8px;
    font-size: 8px; color: #6a5a4a;
    height: 34px; overflow-y: auto;
    line-height: 1.4; font-family: monospace;
    flex-shrink: 0;
  }
  .log .p { color: #7ac0e8; }
  .log .e { color: #e87a7a; }
  .log .d { color: #e8a87a; }
  .log .g { color: #ffd966; }
</style>
</head>
<body>

<div id="app">

  <!-- ============ TITLE ============ -->
  <div id="title-screen" class="screen">
    <div class="crown"></div>
    <h1>IRON CROWN</h1>
    <h2>THE LAST FORTRESS</h2>
    <button class="btn" id="play-btn" type="button">▶ PLAY</button>
    <div class="tagline">ASHLANDS · 1897</div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game-screen" class="screen hidden">

    <div class="topbar">
      <button class="quit-btn" id="quit-btn" type="button">← QUIT</button>
      <div class="hp-block left">
        <div class="hp-label">⌘ IRON CROWN</div>
        <div class="hp-track"><div class="hp-fill" id="p-hpfill" style="width:100%"></div></div>
        <div class="hp-num" id="p-hpnum">375 / 375</div>
      </div>
      <button class="pause-btn" id="pause-btn" type="button">❚❚</button>
      <div class="hp-block right">
        <div class="hp-label">AUREATE · DRAHL</div>
        <div class="hp-track"><div class="hp-fill" id="e-hpfill" style="width:100%"></div></div>
        <div class="hp-num" id="e-hpnum">375 / 375</div>
      </div>
    </div>

    <div class="battlefield" id="battlefield">
      <div class="sky-glow"></div>
      <div class="fortress player" id="player-fortress">
        <div class="fortress-label">VEYRAN REMNANT</div>
      </div>
      <div class="fortress enemy" id="enemy-fortress">
        <div class="fortress-label">AUREATE IMPERIAL</div>
      </div>
      <div class="no-mans-land" id="no-mans-land"></div>
    </div>

    <div class="control-panel">
      <div class="resource-row">
        <div class="res"><span>⛓ IRON</span><span class="val" id="res-iron">80</span></div>
        <div class="res"><span>♨ STEAM</span><span class="val" id="res-steam">40</span></div>
        <div class="res"><span>◉ AMMO</span><span class="val" id="res-ammo">12</span></div>
      </div>
      <div class="crew-row" id="crew-row">
        <div class="crew-placeholder">CREW ROW — EMPTY (STAGE 3)</div>
      </div>
      <div class="action-row">
        <button class="btn" id="weapon-btn" type="button" disabled>⚔ SELECT WEAPON</button>
        <button class="btn" id="repair-btn" type="button" disabled>🔧 REPAIR</button>
      </div>
    </div>

    <div class="log" id="log"></div>

  </div>
</div>

<script>
(function(){
  'use strict';

  // -------- room definitions --------
  var ROOM_DEFS = [
    { key:'bridge',   name:'COMMAND BRIDGE', icon:'⌘', maxHp:100 },
    { key:'gun',      name:'GUN DECK',       icon:'✷', maxHp:70  },
    { key:'boiler',   name:'BOILER ROOM',    icon:'♨', maxHp:60  },
    { key:'workshop', name:'WORKSHOP',       icon:'⚒', maxHp:50  },
    { key:'barracks', name:'BARRACKS',       icon:'⌂', maxHp:55  },
    { key:'aether',   name:'AETHER CHAMBER', icon:'◈', maxHp:40, aether:true }
  ];

  var paused = false;
  var simRunning = false;

  function $(id){ return document.getElementById(id); }

  function makeRoomEl(room, side){
    var d = document.createElement('div');
    d.className = 'room';
    if (room.aether) d.classList.add('aether');
    var pct = 100;
    d.innerHTML =
      '<div class="rname">' +
        '<span><span class="ricon">' + room.icon + '</span> ' + room.name + '</span>' +
        '<span class="rhp">' + room.maxHp + '/' + room.maxHp + '</span>' +
      '</div>' +
      '<div class="hpbar"><div class="hpfill" style="width:' + pct + '%"></div></div>';
    d.addEventListener('click', function(){
      logLine('Tapped ' + room.name + ' (' + side + ') — stage 2 will add actions.', 'p');
    });
    return d;
  }

  function buildFortresses(){
    var pf = $('player-fortress');
    var ef = $('enemy-fortress');
    // wipe rooms but keep label
    var pl = pf.querySelector('.fortress-label');
    var el = ef.querySelector('.fortress-label');
    while (pf.firstChild) pf.removeChild(pf.firstChild);
    while (ef.firstChild) ef.removeChild(ef.firstChild);
    if (pl) pf.appendChild(pl);
    if (el) ef.appendChild(el);
    for (var i = 0; i < ROOM_DEFS.length; i++){
      pf.appendChild(makeRoomEl(ROOM_DEFS[i], 'player'));
      ef.appendChild(makeRoomEl(ROOM_DEFS[i], 'enemy'));
    }
  }

  function logLine(msg, cls){
    var el = $('log');
    if (!el) return;
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    // cap at 30 lines
    while (el.children.length > 30) el.removeChild(el.firstChild);
  }

  function clearLog(){
    var el = $('log');
    if (el) el.innerHTML = '';
  }

  function setPaused(p){
    paused = p;
    var pb = $('pause-btn');
    if (pb){
      pb.textContent = paused ? '▶' : '❚❚';
      if (paused) pb.classList.add('paused');
      else pb.classList.remove('paused');
    }
  }

  // -------- transitions --------
  function showTitle(){
    simRunning = false;
    setPaused(false);
    $('game-screen').classList.add('hidden');
    $('title-screen').classList.remove('hidden');
  }

  function startGame(){
    try {
      // reset display
      buildFortresses();
      clearLog();
      setPaused(false);
      $('p-hpfill').style.width = '100%';
      $('e-hpfill').style.width = '100%';
      $('p-hpnum').textContent = '375 / 375';
      $('e-hpnum').textContent = '375 / 375';
      $('res-iron').textContent = '80';
      $('res-steam').textContent = '40';
      $('res-ammo').textContent = '12';

      logLine('» The Iron Crown takes position.', 'g');
      logLine('» Aureate Imperial battery sighted across the line.', 'e');
      logLine('» STAGE 1 — layout only. No combat yet.', 'p');

      $('title-screen').classList.add('hidden');
      $('game-screen').classList.remove('hidden');
      simRunning = true;
    } catch (err){
      // fallback so we see the error rather than freeze
      var el = $('log');
      if (el) el.textContent = 'ERROR: ' + err.message;
      alert('startGame error: ' + err.message);
    }
  }

  // -------- wiring --------
  function wire(){
    var play = $('play-btn');
    var quit = $('quit-btn');
    var pause = $('pause-btn');

    if (play) play.addEventListener('click', function(){
      logLine('PLAY tapped', 'p');
      startGame();
    });
    if (quit) quit.addEventListener('click', function(){
      showTitle();
    });
    if (pause) pause.addEventListener('click', function(){
      if (!simRunning) return;
      setPaused(!paused);
      logLine(paused ? '» Battle paused.' : '» Battle resumed.', 'g');
    });
  }

  wire();
  buildFortresses(); // prebuild so title screen has them ready

})();
</script>
</body>
  </html>
